title: Chai Weekly
motto: "Tea news from East Africa and the world, every week"
description: "A free weekly tea newspaper from East Africa. Every Wednesday: tea news from Kenya, the region and the world, Mombasa auction prices, tea weather and coming events."
# Our own mailing list (listmonk on the VPS; set-up steps in deploy/listmonk/SETUP.md).
# listmonk_url: where the list runs. listmonk_list_uuid: the list's long code (Lists > the list > "UUID"),
# used by the Subscribe box. listmonk_list_id: the list's number (shown as #3 etc.), used for email drafts.
# The Subscribe box stays in "opens soon" mode until listmonk_list_uuid is filled in.
listmonk_url: "https://list.chaiweekly.co.ke"
listmonk_list_uuid: "9e6279b1-e0e0-4257-b93d-1cdc2bf9d4a1"
listmonk_list_id: "3"
# A merged issue emails out this many minutes after the merge (time to pause it in listmonk). Empty = draft only.
listmonk_autosend_minutes: "15"
# New subscribers who join on or after this date get the latest issue once, by email (tools/welcome.py). Empty = off.
welcome_since: "2026-11-26"
permalink: /issues/:year/:month/:day/:title/
markdown: kramdown
plugins: [jekyll-sitemap]
exclude: [deploy, tools, tests, README.md, sources, submissions, drafts, vendor, Gemfile, Gemfile.lock, .bundle, node_modules]
baseurl: ""
url: "https://chaiweekly.co.ke"
# "Send us a story" form. Free, no account: put "https://formsubmit.co/YOUR-EMAIL" here, send yourself
# one test story and click the activation link FormSubmit emails you. It then gives you a random
# address (formsubmit.co/abc123...) to use instead, so your email isn't visible in the page.
story_form_action: ""
# The paper's own address. Marks it as the main copy for search engines (and for a paid-host mirror, if used).
canonical_url: "https://chaiweekly.co.ke"
# Picture shown when a link is shared on WhatsApp, Facebook or X, e.g. "assets/share.jpg" (1200 x 630 px).
# Leave blank for a text-only preview.
share_image: "assets/share-newspaper.jpg"
# Visitor tracking (pick one). GoatCounter is free and cookie-free: sign up at goatcounter.com and
# put your code here (e.g. "chaiweekly" for chaiweekly.goatcounter.com). Visits from the email show
# up as campaign "newsletter"; shared links show up by referring site.
goatcounter_code: ""
# Our own GoatCounter on the VPS (deploy/goatcounter/SETUP.md). When set, it is used instead of goatcounter_code.
goatcounter_url: "https://stats.chaiweekly.co.ke/count"
# Or self-host Umami on your VPS and fill these two in instead.
umami_src: ""
umami_website_id: ""
# preview/ holds a built copy of the redesign (see tools/build_preview.sh). Keep it out of the sitemap.
defaults:
  - scope:
      path: "preview"
    values:
      sitemap: false
