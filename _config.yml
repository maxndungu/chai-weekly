title: Chai Weekly
motto: "The world of tea, one story at a time"
positioning: "Independent coverage of the global tea industry, markets, people and culture."
perspective: "Published from East Africa, with a global outlook."
description: "Chai Weekly is a free, independent weekly magazine about the global tea industry: auction markets, industry news, tea origins, the people who grow and trade tea, and tea culture. Published from East Africa, with a global outlook."
# Byline used when an issue has no `author:` of its own.
default_author: "Chai Weekly desk"

# Mailing list behind "Get the free weekly edition". Fill in ONE of these; the form switches over by itself.
# Until one is set, the form checks the address and says honestly that sign-up is not open yet.
buttondown_username: ""   # e.g. "chaiweekly" for buttondown.com/chaiweekly
substack_url: ""          # e.g. "https://chaiweekly.substack.com"
# Any other provider with a plain HTML sign-up form (Mailchimp, MailerLite, listmonk on your VPS...):
# its form "action" URL and the name of its email field.
newsletter_action: ""
newsletter_email_field: "email"

# Contact details shown in the footer and on the contact page. Leave blank to hide.
contact_email: ""
contact_whatsapp: ""      # e.g. "254712345678" (no +), shown as a WhatsApp link
# Social links in the footer. Leave blank to hide.
social:
  x: ""                   # full URLs, e.g. "https://x.com/chaiweekly"
  facebook: ""
  instagram: ""
  linkedin: ""
  youtube: ""
  whatsapp_channel: ""
permalink: /issues/:year/:month/:day/:title/
markdown: kramdown
plugins: [jekyll-sitemap]
exclude: [tools, tests, README.md, sources, submissions, drafts, vendor, Gemfile, Gemfile.lock, .bundle, node_modules]
baseurl: "/chai-weekly"
url: "https://maxndungu.github.io"
# "Send us a story" form. Free, no account: put "https://formsubmit.co/YOUR-EMAIL" here, send yourself
# one test story and click the activation link FormSubmit emails you. It then gives you a random
# address (formsubmit.co/abc123...) to use instead, so your email isn't visible in the page.
story_form_action: ""
# Your paid-host domain, e.g. "https://chaiweekly.co.ke". Marks it as the main copy for search engines.
canonical_url: ""
# Picture shown when a link is shared on WhatsApp, Facebook or X, e.g. "assets/share.jpg" (1200 x 630 px).
# Leave blank for a text-only preview.
share_image: ""
# Visitor tracking (pick one). GoatCounter is free and cookie-free: sign up at goatcounter.com and
# put your code here (e.g. "chaiweekly" for chaiweekly.goatcounter.com). Visits from the email show
# up as campaign "newsletter"; shared links show up by referring site.
goatcounter_code: ""
# Or self-host Umami on your VPS and fill these two in instead.
umami_src: ""
umami_website_id: ""
