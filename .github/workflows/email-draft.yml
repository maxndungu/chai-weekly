# When a new issue is published (merged to main), create a Buttondown email DRAFT of it.
# Nothing is sent: open Buttondown, check the draft and press Send.
# Needs repo secret BUTTONDOWN_API_KEY (Buttondown > Settings > API). Skips quietly without it.
name: Email draft
on:
  push:
    branches: [main]
    paths: ["_posts/**"]
  workflow_dispatch:
jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Create Buttondown draft for each new issue
        if: env.BUTTONDOWN_API_KEY != ''
        run: |
          SITE_URL=$(python3 -c "import re;c=open('_config.yml').read();g=lambda k:(re.search(r'^'+k+r':\s*\"?([^\"\n]*)',c,re.M) or [0,''])[1];print((g('canonical_url') or g('url')+g('baseurl')).rstrip('/'))")
          export SITE_URL
          for f in $(git diff --name-only --diff-filter=A HEAD~1 HEAD -- _posts); do python3 tools/to_buttondown.py "$f"; done
