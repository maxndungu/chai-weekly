# When a new issue is published (merged to main), make it an email campaign in our own mailing list (listmonk)
# and schedule it to send listmonk_autosend_minutes later (_config.yml; empty = leave it as a draft to start by hand).
# To stop a send in that time: https://list.chaiweekly.co.ke/admin > Campaigns > the issue > Pause.
# It also puts the issue into the welcome email that new subscribers get (see welcome.yml).
# Needs two repo secrets from listmonk (Admin > Users > API user): LISTMONK_API_USER and LISTMONK_API_TOKEN.
# The list's address and number come from _config.yml (listmonk_url, listmonk_list_id). Skips quietly until both are set.
# To redo a draft by hand: Actions > Email draft > Run workflow, and give the issue file (e.g. _posts/2026-11-18-issue-003.md).
# A draft made by hand is never sent on its own.
# To refresh a draft that already exists in listmonk (e.g. after a design change), also give its campaign number.
# The email's look lives in tools/to_listmonk.py and tools/email/listmonk-template.html.
name: Email draft
on:
  push:
    branches: [main]
    paths: ["_posts/**"]
  workflow_dispatch:
    inputs:
      post:
        description: "Issue file to turn into a draft, e.g. _posts/2026-11-18-issue-003.md"
        required: true
      campaign:
        description: "Optional: number of an existing listmonk draft to update instead of making a new one (e.g. 2)"
        required: false
jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      LISTMONK_API_USER: ${{ secrets.LISTMONK_API_USER }}
      LISTMONK_API_TOKEN: ${{ secrets.LISTMONK_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q markdown==3.7 PyYAML==6.0.2
      - name: Create listmonk draft for each new issue
        if: env.LISTMONK_API_TOKEN != ''
        env:
          BEFORE: ${{ github.event.before }}
          POST: ${{ inputs.post }}
          LISTMONK_CAMPAIGN_ID: ${{ inputs.campaign }}
        run: |
          cfg() { python3 -c "import re,sys;c=open('_config.yml').read();m=re.search(r'^'+sys.argv[1]+r':\s*\"?([^\"\n#]*)',c,re.M);print(m[1].strip() if m else '')" "$1"; }
          SITE_URL=$(cfg canonical_url); [ -n "$SITE_URL" ] || SITE_URL="$(cfg url)$(cfg baseurl)"
          export SITE_URL="${SITE_URL%/}" LISTMONK_URL=$(cfg listmonk_url) LISTMONK_LIST_ID=$(cfg listmonk_list_id) LISTMONK_WELCOME=1
          # Only a merge sends on its own; a draft redone by hand waits for Start in listmonk.
          if [ -z "$POST" ]; then export LISTMONK_AUTOSEND_MINUTES=$(cfg listmonk_autosend_minutes); fi
          if [ -z "$LISTMONK_URL" ] || [ -z "$LISTMONK_LIST_ID" ]; then
            echo "listmonk_url or listmonk_list_id is empty in _config.yml: no draft made."; exit 0
          fi
          if [ -n "$POST" ]; then
            files="$POST"
          else
            # Every issue added by this push, however the pull request was merged (one commit or several).
            git cat-file -e "$BEFORE^{commit}" 2>/dev/null || BEFORE=HEAD~1
            files=$(git diff --name-only --diff-filter=A "$BEFORE" HEAD -- _posts)
          fi
          for f in $files; do python3 tools/to_listmonk.py "$f"; done
