# Counts the mailing list's readers and emails the numbers privately to Maxwell (secret READER_REPORT_TO).
# This repository and its logs are public, so the numbers are never printed. Script: tools/reader_stats.py.
name: Reader numbers
on:
  workflow_dispatch:
jobs:
  stats:
    runs-on: ubuntu-latest
    env:
      LISTMONK_API_USER: ${{ secrets.LISTMONK_API_USER }}
      LISTMONK_API_TOKEN: ${{ secrets.LISTMONK_API_TOKEN }}
      READER_REPORT_TO: ${{ secrets.READER_REPORT_TO }}
    steps:
      - uses: actions/checkout@v4
      - name: Count readers
        if: env.LISTMONK_API_TOKEN != ''
        run: |
          cfg() { python3 -c "import re,sys;c=open('_config.yml').read();m=re.search(r'^'+sys.argv[1]+r':\s*\"?([^\"\n#]*)',c,re.M);print(m[1].strip() if m else '')" "$1"; }
          export LISTMONK_URL=$(cfg listmonk_url) LISTMONK_LIST_ID=$(cfg listmonk_list_id)
          python3 tools/reader_stats.py
