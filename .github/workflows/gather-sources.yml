# Every Monday 06:00 Nairobi time, collect the week's tea news into sources/.
name: Gather sources
on:
  schedule: [{ cron: "0 3 * * 1" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/gather.py
      - run: |
          git config user.name "chai-bot"
          git config user.email "chai-bot@users.noreply.github.com"
          git add sources && git commit -m "Sources for $(date +%F)" && git push || echo "nothing new"
