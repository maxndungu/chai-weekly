# Auction data (the Auctions page and dashboard) updates twice a week only, Tuesday 16:00 and Friday 14:00
# Nairobi time (Maxwell's choice, 2026-11-24): the EATTA sales go to _data/mombasa_eatta_sales.csv and Combrok's per-sale figures
# (kg and lots offered, for the share sold) to _data/mombasa_combrok_sales.csv. EATTA keeps adding late sales until
# Friday noon, so Tuesday's figures for the newest sale are provisional and Friday's run saves the final ones.
# Combrok posts offered weights later in the week, so a Wednesday 12:13 run (Maxwell, 2026-11-25) rechecks them and
# EATTA's sold figures, with a 17:13 retry if the newest sale still has no offered figure. Keep this schedule
# internal: don't mention it on the site, in the newsletter or in the dashboard notes.
# Every Wednesday, collect the week's tea news into sources/ for the draft, with EATTA's figures and the Combrok
# cross-check as text for the reviewer notes. The Wednesday runs do not change the auction data files.
#
# Scheduled times (GitHub cron is UTC): GitHub starts scheduled runs late when it is busy, by up to 8 hours on
# this repo (the Wednesday 06:00 run started at 14:14 Nairobi on 18 Nov and had not started by 10:00 on 25 Nov),
# and busy times are worst on the hour. So the times sit off the hour, the Wednesday news run starts at 00:41
# Nairobi to leave a margin before the 07:15 draft, and a second run at 05:17 fills in if the first has not run yet
# (it does nothing if today's sources file is already there). The draft session can also start a news-only run
# by hand (tools/AUTODRAFT.md, step 2). The job runs on Nairobi time, so files are named by Nairobi's date.
name: Gather sources
on:
  schedule:
    - cron: "13 13 * * 2"  # Tuesday 16:13 Nairobi: auction data only (EATTA and Combrok files)
    - cron: "13 11 * * 5"  # Friday 14:13 Nairobi: auction data only, final figures
    - cron: "13 9 * * 3"   # Wednesday 12:13 Nairobi: auction data only (recheck Combrok offered, EATTA sold)
    - cron: "13 14 * * 3"  # Wednesday 17:13 Nairobi: the same, only if the newest sale still has no offered figure
    - cron: "41 21 * * 2"  # Wednesday 00:41 Nairobi: news, weather, auction text for the draft
    - cron: "17 2 * * 3"   # Wednesday 05:17 Nairobi: the same, only if the 00:41 run has not saved today's file
  workflow_dispatch:
    inputs:
      csv_only:
        description: "Only update the auction data (EATTA and Combrok files; skip news and the sources file)"
        type: boolean
        default: false
      news_only:
        description: "Only collect the news for the draft (like the Wednesday run; leave the auction data files alone)"
        type: boolean
        default: false
permissions:
  contents: write
# Never run two collections at once (a manual run during the scheduled one); the second waits its turn.
concurrency: { group: gather-sources, cancel-in-progress: false }
jobs:
  gather:
    runs-on: ubuntu-latest
    env:
      TZ: Africa/Nairobi
      CSV_ONLY: ${{ inputs.csv_only || github.event.schedule == '13 13 * * 2' || github.event.schedule == '13 11 * * 5' || github.event.schedule == '13 9 * * 3' || github.event.schedule == '13 14 * * 3' }}
      # The Wednesday news runs (and a news-only run by hand) leave the auction data files alone
      # (they update on Tuesdays and Fridays only).
      WEDNESDAY: ${{ inputs.news_only || github.event.schedule == '41 21 * * 2' || github.event.schedule == '17 2 * * 3' }}
      BACKUP_RUN: ${{ github.event.schedule == '17 2 * * 3' }}
      OFFERED_RETRY: ${{ github.event.schedule == '13 14 * * 3' }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip the 17:13 run if the 12:13 run already saved offered kg for the newest sale
        if: ${{ env.OFFERED_RETRY == 'true' }}
        run: |
          if python - <<'PY'
          import csv, sys
          e = list(csv.DictReader(open("_data/mombasa_eatta_sales.csv")))
          last = max(e, key=lambda r: (int(r["year"]), int(r["sale"])))
          c = [r for r in csv.DictReader(open("_data/mombasa_combrok_sales.csv"))
               if r["year"] == last["year"] and r["sale"] == last["sale"] and r["ctc_offered_kg"]]
          sys.exit(0 if c else 1)
          PY
          then
            echo "Offered kg for the newest sale is already saved; nothing to do."
            echo "SKIP_ALL=true" >> "$GITHUB_ENV"
          fi
      - name: Skip the 05:17 run if the 00:41 run already saved today's sources
        if: ${{ env.BACKUP_RUN == 'true' }}
        run: |
          if [ -s "sources/$(date +%F).md" ]; then
            echo "sources/$(date +%F).md is already there; nothing to do."
            echo "CSV_ONLY=true" >> "$GITHUB_ENV"
            echo "WEDNESDAY=true" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # A failed step turns the run red (GitHub emails the repo owner), but the steps after it still run
      # and whatever was collected is still saved.
      - name: News headlines and auction report links
        id: news
        if: ${{ env.CSV_ONLY != 'true' }}
        # Exit code 3 = every feed failed on a re-run, and the file gathered earlier today was kept as it is.
        run: python tools/gather.py || { code=$?; if [ $code -eq 3 ]; then echo "kept=1" >> "$GITHUB_OUTPUT"; fi; exit $code; }
      - name: Weather snapshot for the tea areas
        if: ${{ !cancelled() && env.CSV_ONLY != 'true' && steps.news.outputs.kept != '1' }}
        run: python tools/weather.py >> "sources/$(date +%F).md"
      - name: Save every EATTA sale to _data/mombasa_eatta_sales.csv
        if: ${{ !cancelled() && env.WEDNESDAY != 'true' && env.SKIP_ALL != 'true' }}
        run: |
          python tools/eatta_csv.py || { echo "::error::EATTA CSV update failed; check https://eatta.co.ke/statistics"; exit 1; }
      - name: Save Combrok's per-sale figures (offered, sold, lots, grade averages) for the dashboard
        if: ${{ !cancelled() && env.WEDNESDAY != 'true' && env.SKIP_ALL != 'true' }}
        run: |
          python tools/combrok_csv.py || echo "::warning::Combrok figures not updated; the dashboard keeps last week's offered and absorption figures"
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() && env.CSV_ONLY != 'true' && steps.news.outputs.kept != '1' }}
        with: { node-version: "22" }
      - name: Mombasa figures from EATTA (page needs a browser)
        if: ${{ !cancelled() && env.CSV_ONLY != 'true' && steps.news.outputs.kept != '1' }}
        run: |
          mkdir -p sources
          ( npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium ) || echo "::warning::Could not install the browser for EATTA"
          node tools/eatta.mjs >> "sources/$(date +%F).md" || echo "- **Mombasa (EATTA)**: could not render, check by hand <https://eatta.co.ke/statistics>" >> "sources/$(date +%F).md"
      - name: Cross-check EATTA against Combrok's figures (for the reviewer notes)
        if: ${{ !cancelled() && env.CSV_ONLY != 'true' && steps.news.outputs.kept != '1' }}
        run: python tools/combrok_check.py >> "sources/$(date +%F).md"
      - name: Save what was collected
        if: ${{ !cancelled() }}
        run: |
          git config user.name "chai-bot"
          git config user.email "chai-bot@users.noreply.github.com"
          git add sources _data && git commit -m "Sources and EATTA sales for $(date +%F)" || { echo "nothing new"; exit 0; }
          git pull --rebase origin main && git push
