# Photo library. Every picture on the site comes from this list; until a photo fits, the page shows a
# drawn illustration instead (never a stock photo passed off as reporting).
#
# To add a photo:
#   1. Put a landscape JPG in assets/photos/, about 2000 px wide and under 500 KB
#      (and, optionally, an 800 px wide copy named <same name>-800.jpg for story cards and phones).
#   2. Add an entry below. Only use photos you took, or photos whose licence allows this use, and give the credit.
#   3. To put it on an issue, add `image: <id>` to the issue's front matter (or `image:` on one story).
#      Photos tagged with a category are also used for that category's story cards.
#
# - id: kericho-plucking                       # short name, used in front matter
#   file: assets/photos/kericho-plucking.jpg
#   small: assets/photos/kericho-plucking-800.jpg   # optional
#   alt: "Two tea pluckers with baskets on their backs walk between rows of tea bushes"   # what the photo shows
#   caption: "Plucking near Kericho, Kenya, March 2026."   # where and when, only if you know it
#   credit: "Photo: Maxwell Mbugua"            # or "Photo: Name / CC BY-SA 4.0"
#   credit_url: ""                             # licence or source page, if any
#   categories: [origins, people]              # markets | industry | origins | people | culture
