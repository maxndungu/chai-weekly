      - { iso3: GEO, map: "268" }
      - { iso3: AZE, map: "031" }
      - { iso3: RUS, map: "643" }
      - { iso3: SUN, map: ["643", "268", "031"], to: 1991 }
      - { iso3: PRT, map: "620" }
      - { iso3: MNE, map: "499" }
  - id: americas
    name: Americas
    countries:
      - { iso3: ARG, map: "032" }
      - { iso3: BRA, map: "076" }
      - { iso3: BOL, map: "068" }
      - { iso3: COL, map: "170" }
      - { iso3: ECU, map: "218" }
      - { iso3: SLV, map: "222" }
