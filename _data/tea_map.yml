    countries:
      - { iso3: IND, map: "356" }
      - { iso3: LKA, map: "144" }
      - { iso3: BGD, map: "050" }
      - { iso3: NPL, map: "524" }
      - { iso3: IRN, map: "364" }
  - id: east-asia
