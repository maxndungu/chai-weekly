  - id: southeast-asia
    name: Southeast Asia and Pacific
    countries:
      - { iso3: VNM, map: "704" }
      - { iso3: IDN, map: "360" }
      - { iso3: MYS, map: "458" }
      - { iso3: MMR, map: "104" }
      - { iso3: THA, map: "764" }
