# The Tea map page (/tea-map/): which region each producing country sits in, where it is on the map,
# and which auction its figures can be drilled into.
#
# To add a country: put its yearly figures in _data/tea_production.csv (country, iso3, year, made_tea_t, source)
# and add it under its region below. "map" is its ISO number in the world map file
# (assets/data/world-110m.json); "dot" [longitude, latitude] draws it as a dot instead, for islands too
# small for the map. A country with figures but no entry here still shows in the totals, under "Other".
#
# To add an auction: add it under "markets" with the countries it sells for and a "series" name, then
# teach assets/tea-map.js how to read that series (see marketSeries() there). Countries listed under a
# market get its price chart when they are tapped.

regions:
  - id: eastern-africa
    name: Eastern Africa
    countries:
      - { iso3: KEN, map: "404" }
      - { iso3: UGA, map: "800" }
      - { iso3: TZA, map: "834" }
      - { iso3: RWA, map: "646" }
      - { iso3: BDI, map: "108" }
      - { iso3: ETH, map: "231" }
      - { iso3: ETH_ERI, map: ["231", "232"], to: 1992 }
      - { iso3: MWI, map: "454" }
      - { iso3: MOZ, map: "508" }
      - { iso3: MDG, map: "450" }
      - { iso3: ZMB, map: "894" }
      - { iso3: ZWE, map: "716" }
      - { iso3: MUS, dot: [57.55, -20.25] }
      - { iso3: REU, dot: [55.53, -21.12] }
      - { iso3: SYC, dot: [55.45, -4.68] }
  - id: rest-of-africa
    name: Rest of Africa
    countries:
      - { iso3: COD, map: "180" }
      - { iso3: CMR, map: "120" }
      - { iso3: ZAF, map: "710" }
      - { iso3: MLI, map: "466" }
  - id: south-asia
