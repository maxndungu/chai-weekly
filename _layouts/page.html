---
layout: default
---
<header class="page-head wrap">
  {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
  <h1 class="page-title">{{ page.heading | default: page.title }}</h1>
  {% if page.intro %}<p class="page-intro">{{ page.intro }}</p>{% endif %}
</header>
<div class="wrap page-body">
  <div class="prose">
{{ content }}
  </div>
</div>
