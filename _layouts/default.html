<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.deck | default: page.description | default: site.description }}">
  {% if site.canonical_url != "" %}<link rel="canonical" href="{{ site.canonical_url }}{{ page.url }}">{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Libre+Franklin:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <div class="paper">
    {% if page.layout == 'post' %}{% include masthead.html compact=true %}{% else %}{% include masthead.html %}{% endif %}
    <main>{{ content }}</main>
    <footer class="colophon">
      <span>{{ site.title }} · A free, independent hobby newsletter about tea, from Kenya and the world.</span>
      <span><a href="{{ '/archive/' | relative_url }}">Archive</a> · <a href="{{ '/about/' | relative_url }}">About</a> · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></span>
    </footer>
  </div>
</body>
</html>
